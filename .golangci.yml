version: "2"

run:
  go: "1.25"
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - staticcheck
    - ineffassign
    - misspell
    - gosec

linters-settings:
  govet:
    enable-all: false
    shadow: true
  errcheck:
    check-type-assertions: false
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/shift/enrichment-engine
  misspell:
    locale: US
  gosec:
    excludes:
      - G101
      - G404
    config:
      global:
        audit: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: test/
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-dirs:
    - vendor

# The severity block was removed rather than migrated. It failed to load under
# golangci-lint v2 ("no default severity defined"), and it downgraded errcheck
# and gosec to "info", which quietly weakens exactly the findings that matter
# most here. Removing it means findings are reported at their normal severity.
#
# gofmt and goimports are FORMATTERS in golangci-lint v2, not linters. They
# were listed under linters.enable, which makes the configuration fail to load,
# so the job died before analysing a single file. That is why the lint gate
# reported failure with no findings: it never ran.
formatters:
  enable:
    - gofmt
    - goimports
